<!doctype html>
<html>
  <head>
    <title>EMS Dashboard</title>
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="adminDash.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="cont">
      <div class="sideb">
        <h2>EMS</h2>
        <div class="menu active">
          <i class="fa-solid fa-house"></i>
          <a href="adminDash.html">Dashboard</a>
        </div>
        <div class="menu">
          <i class="fa-solid fa-users"></i>
          <a href="Employee.html">Employees</a>
        </div>
        <div class="menu">
          <i class="fa-solid fa-box"></i>
                    <a href="Assets.html"style="text-decoration=none">Assets</a>

        </div>
        <div class="menu">
          <i class="fa-solid fa-file-lines"></i>
          Requests
        </div>
        <div class="logout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <a href="adminLogin.html" class="logoutlink">Logout</a>
        </div>
      </div>
      <div class="right">
        <div class="top">
          <h2>Dashboard</h2>
          <div id="quote"></div>
          <div class="admin">
            <i class="fa-solid fa-circle-user"></i>
            Admin
            <i class="fa-solid fa-chevron-down" id="drop"></i>
          </div>
        </div>
        <div class="cards">
          <div class="card">
            <div class="cardicon b">
              <i class="fa-solid fa-users"></i>
            </div>
            <div>
              <p>Total Employees</p>
              <h2 id="totalcount">52</h2>
            </div>
          </div>
          <div class="card">
            <div class="cardicon g">
              <i class="fa-solid fa-box"></i>
            </div>
            <div>
              <p>Total Assets</p>
              <h2>65</h2>
            </div>
          </div>
          <div class="card">
            <div class="cardicon o">
              <i class="fa-solid fa-file-circle-check"></i>
            </div>
            <div>
              <p>Total Requests</p>
              <h2>18</h2>
            </div>
          </div>
          <div class="card">
            <div class="cardicon pu">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div>
              <p>Pending Requests</p>
              <h2>7</h2>
            </div>
          </div>
        </div>
        <div class="bottom">
            <div class="box">
      <h3>Recent Activities</h3>

      <div id="activityList"></div>

      <a href="" class="t" style="color: blue; text-decoration: none;">
        View All
      </a>
    </div>
          <div class="box">
            <h3>Pending Requests</h3>
            <table>
              <tr>
                <th>Type</th>
                <th>Count</th>
                <th>View</th>
              </tr>
              <tr>
                <td>Leave Requests</td>
                <td>5</td>
                <td>
                  <i class="fa-solid fa-eye"></i>
                </td>
              </tr>
              <tr>
                <td>Asset Requests</td>
                <td>3</td>
                <td>
                  <i class="fa-solid fa-eye"></i>
                </td>
              </tr>
              <tr>
                <td>Other Requests</td>
                <td>2</td>
                <td>
                  <i class="fa-solid fa-eye"></i>
                </td>
              </tr>
            </table>
            <a href="" class="tt" style="color: blue;text-decoration: none;">View All</a>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="adminDash.js">
   
  </script>
</html>

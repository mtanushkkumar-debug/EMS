<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EMS - Employees</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="Employee.css">
</head>

<body>

  <div class="cont">

    <div class="sideb">
      <h2>EMS</h2>

      <div class="menu">
        <i class="fa-solid fa-house"></i>
        <a href="adminDash.html">Dashboard</a>
      </div>

      <div class="menu active">
        <i class="fa-solid fa-users"></i>
        <a href="Employee.html">Employees</a>
      </div>

      <div class="menu">
        <i class="fa-solid fa-box"></i>
        <a href="Assets.html">Assets</a>
      </div>

      <div class="menu">
        <i class="fa-solid fa-file-lines"></i>
        <a href="#">Requests</a>
      </div>

      <div class="logout">
        <i class="fa-solid fa-right-from-bracket"></i>
        <a href="adminLogin.html">Logout</a>
      </div>
    </div>

    <div class="modal">
      <div class="modalbox">

        <div class="modalheader">
          <h2>Add Employee</h2>
          <span id="closeModal">&times;</span>
        </div>

        <div class="modalbody">
          <label>Employee ID</label>
          <input type="text" id="empId" placeholder="Employee id">

          <label>Name</label>
          <input type="text" id="employeeName" placeholder="Employee name">

          <label>Department</label>
          <select id="employeeDepartment">
            <option value="">Select Department</option>
            <option value="Development">Development</option>
            <option value="Testing">Testing</option>
            <option value="Design">Design</option>
            <option value="HR">HR</option>
          </select>

          <label>Role</label>
          <select id="employeeRole">
            <option value="">Select Role</option>
            <option value="Employee">Employee</option>
            <option value="Intern">Intern</option>
            <option value="Team Lead">Team Lead</option>
          </select>

      <div id="teamLeadField">
          <label>Team Lead</label>
          <input type="text" id="employeeTeamLead" placeholder="Team lead name">
        </div>

          <label>Status</label>
          <select id="employeeStatus">
            <option value="Active">Active</option>
            <option value="On Leave">On Leave</option>
            <option value="AFK">AFK</option>
            <option value="Pending">Pending</option>
            <option value="Inactive">Inactive</option>
          </select>

          <button type="button" id="saveEmployee" class="save-employee">
            Save Employee
          </button>
        </div>

      </div>
    </div>

    <div class="right employee-r">

      <div class="top">
        <h2>Employees</h2>

        <button type="button" class="btn btn-primary add-btn">
          <i class="fa-solid fa-plus"></i>
          Add Employee
        </button>
      </div>

      <div class="empbox">

        <div class="filter-row">

          <div class="searchbox">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchEmployee" placeholder="Search employees...">
          </div>

          <select id="roleFilter" class="form-select role-filter">
            <option value="All">All Roles</option>
            <option value="Employee">Employee</option>
            <option value="Intern">Intern</option>
            <option value="Team Lead">Team Lead</option>
          </select>

        </div>

        <table class="employee-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Team Lead</th>
              <th>Status</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="employeebody"></tbody>
        </table>

        <div class="emp-bottom">
          <nav>
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Employee.js"></script>

</body>
</html>
